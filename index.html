<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring in GenTrust</title>
    <style>
        /* Background container */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: -1;
        }
    </style>
    
    <style>
        .butterfly {
            position: fixed;
            width: 20px;
            height: 20px;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            opacity: 0.9;
        }
    
        @keyframes flutter {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(var(--x1), var(--y1)) rotate(30deg);
            }
            50% {
                transform: translate(var(--x2), var(--y2)) rotate(0deg);
            }
            75% {
                transform: translate(var(--x3), var(--y3)) rotate(-30deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }
    </style>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: url('bg.JPG') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        .video-container {
            width: 95%;
            height: 25%;
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 25px!important;
            overflow: hidden;
            background: black;
            display: none;
            box-shadow: 0 0 20px 10px rgba(255, 140, 0, 0.7),
                        inset 0 0 30px 10px rgba(255, 70, 0, 0.5);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        .top-left {
            position: absolute;
            top: 5%;
            left: 5%;
            color: #fff;
            font-size: 14px;
        }

        .fact {
            position: absolute;
            top: 15%;
            left: 5%;
            font-size: 16px;
            color: #fff;
        }

        .snowflake {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall 10s linear infinite;
            opacity: 0.9;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        button {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            color: #333;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Fireplace -->
    <div class="video-container" id="video-container">
        <video autoplay loop id="fireplace-video">
            <source src="video.mp4" type="video/mp4">
            <source src="video.webm" type="video/webm">
            <source src="video.ogg" type="video/ogg">
            Your browser does not support the video tag.
        </video>
        <button id="play-button">Play Fireplace Sound 🔊</button>
    </div>

    <style>
        /* Panel Styling */
        .info-panel {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.6); /* White with transparency */
            backdrop-filter: blur(10px); /* Frosted Glass Effect */
            padding: 15px 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 400px;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    
        /* Time Styling */
        .time {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
    
        /* Date Styling */
        .date {
            font-size: 14px;
            color: #555;
        }
    
        /* Temperature Styling */
        .temperature {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-align: right;
        }
    </style>
    
    <!-- Info Panel -->
    <div class="info-panel">
        <div>
            <div class="time" id="time">--:--</div>
            <div class="date" id="date">--/--/----</div>
        </div>
        <div class="temperature" id="temperature">Loading...</div>
    </div>
    <style>
        /* Background container */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: -1;
        }
    </style>
    
    <!-- Background Elements -->
    <div class="background-container" id="background"></div>
    
    <script>
        const backgrounds = ['p1.png', 'p2.png', 'p3.png', 'p4.png', 'p5.png', 'p6.png', 'p7.png', 'p8.png', 'p9.png'];
        let bgIndex = 0;
        const backgroundDiv = document.getElementById("background");
    
        function changeBackground() {
            backgroundDiv.style.opacity = "0"; // Fade out
    
            setTimeout(() => {
                backgroundDiv.style.backgroundImage = `url('${backgrounds[bgIndex]}')`; // Change image
                backgroundDiv.style.opacity = "1"; // Fade in
                bgIndex = (bgIndex + 1) % backgrounds.length;
            }, 1500); // Wait for fade-out to complete before switching
        }
    
        // Change background every 2 minutes (120,000 ms)
        setInterval(changeBackground, 120000);
        changeBackground(); // Initial change
    </script>
    <script>
        async function fetchTemperature() {
            try {
                const latitude = 40.7128; 
                const longitude = -74.0060;
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`;
    
                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch weather data.");
    
                const data = await response.json();
                const tempC = data.current_weather.temperature; // Temperature in Celsius
                const tempF = (tempC * 9 / 5 + 32).toFixed(1); // Convert to Fahrenheit
                return { tempC, tempF };
            } catch (error) {
                console.error("Error fetching temperature:", error);
                return { tempC: null, tempF: null }; // Return null if fetch fails
            }
        }
    
        async function updateTimeAndTemperature() {
            const timeDiv = document.getElementById("time");
            const dateDiv = document.getElementById("date");
            const tempDiv = document.getElementById("temperature");
    
            const currentTime = new Date();
            const dateStr = currentTime.toLocaleDateString();
            const timeStr = currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
            timeDiv.textContent = timeStr;
            dateDiv.textContent = dateStr;
    
            // Fetch temperature
            const { tempC, tempF } = await fetchTemperature();
            if (tempC !== null) {
                tempDiv.textContent = `${tempC}°C / ${tempF}°F`;
            } else {
                tempDiv.textContent = "Temperature: N/A";
            }
        }
    
        // Call every minute and on initial load
        setInterval(updateTimeAndTemperature, 60000);
        updateTimeAndTemperature();
    </script>
    <script>
        const backgrounds = ['p1.png', 'p2.png', 'p3.png', 'p4.png', 'p5.png','p6.png','p7.png','p8.png','p9.png'];
        let bgIndex = 0;
    
        function changeBackground() {
            document.body.style.background = `url('${backgrounds[bgIndex]}') no-repeat center center`;
            document.body.style.backgroundSize = "cover";
            bgIndex = (bgIndex + 1) % backgrounds.length;
        }
    
        // Change background every 15 minutes (900000 ms)
        setInterval(changeBackground, 900);
        changeBackground(); // Initial change
    </script>

<script>
    const butterflyImages = ['leaf1.png','leaf2.png','leaf3.png','leaf4.png']; // Add butterfly images
    const maxButterflies = 10; // Max number of butterflies at once

    function createButterfly() {
        const butterfly = document.createElement("div");
        butterfly.classList.add("butterfly");
        document.body.appendChild(butterfly);

        // Randomly select a butterfly image
        const imgIndex = Math.floor(Math.random() * butterflyImages.length);
        butterfly.style.backgroundImage = `url('${butterflyImages[imgIndex]}')`;

        // Random starting position
        const startX = Math.random() * window.innerWidth;
        const startY = Math.random() * window.innerHeight;
        butterfly.style.left = `${startX}px`;
        butterfly.style.top = `${startY}px`;

        // Random size (30px - 60px)
        const size = Math.random() * 30 + 30;
        butterfly.style.width = `${size}px`;
        butterfly.style.height = `${size}px`;

        // Random motion distances (mimicking fluttering)
        butterfly.style.setProperty("--x1", `${Math.random() * 80 - 40}px`);
        butterfly.style.setProperty("--y1", `${Math.random() * 80 - 40}px`);
        butterfly.style.setProperty("--x2", `${Math.random() * 80 - 40}px`);
        butterfly.style.setProperty("--y2", `${Math.random() * 80 - 40}px`);
        butterfly.style.setProperty("--x3", `${Math.random() * 80 - 40}px`);
        butterfly.style.setProperty("--y3", `${Math.random() * 80 - 40}px`);

        // Random animation duration (4s - 12s) for smooth fluttering
        const duration = Math.random() * 8 + 4;
        butterfly.style.animation = `flutter ${duration}s ease-in-out infinite alternate`;

        // Random delay to avoid synchronized movement
        butterfly.style.animationDelay = `${Math.random() * 5}s`;
    }

    function startButterflyAnimation() {
        setInterval(() => {
            if (document.querySelectorAll(".butterfly").length < maxButterflies) {
                createButterfly();
            }
        }, Math.random() * 3000 + 1000); // Random appearance time (1s - 4s)
    }

    startButterflyAnimation(); // Start animation
</script>
</body>
</html>
